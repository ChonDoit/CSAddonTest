name: Build

#Concurrency scoped to the specific branch/ref, not global
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v5
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: |
            rm $GITHUB_WORKSPACE/builds/*.cs3 || true
            rm $GITHUB_WORKSPACE/builds/*.jar || true
            rm $GITHUB_WORKSPACE/builds/plugins.json || true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "adopt"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Access Secrets & Create Properties
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          cd $GITHUB_WORKSPACE/src
          touch local.properties
          echo "SIMKL_API=$SIMKL_API" >> local.properties
          echo "TMDB_KEY=$TMDB_KEY" >> local.properties
          echo "CC_COOKIE=$CC_COOKIE" >> local.properties
          echo "CINE_API=$CINE_API" >> local.properties
          echo "CASTLE_API=$CASTLE_API" >> local.properties

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make clean
          ./gradlew make makePluginsJson
          find . -name "*.cs3" -path "*/build/*" -exec cp {} $GITHUB_WORKSPACE/builds/ \; || echo "No .cs3 files found"
          find . -name "plugins.json" -path "*/build/*"-exec cp {} $GITHUB_WORKSPACE/builds/ \; || echo "No plugins.json found"

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .

          # Only commit/push if there are changes
          if [[ -n $(git status -s) ]]; then
            git commit --amend -m "Build $GITHUB_SHA" || git commit -m "Build $GITHUB_SHA"
            git push --force
          else
            echo "No changes to push"
          fi
